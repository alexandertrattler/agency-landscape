<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>internschiffer</title>
    <link rel="stylesheet" href="styles.css?v=mobile-drawer-5">
  </head>
  <body>
    <header class="meta-console" aria-label="Kennzahlen">
      <strong class="brand-mark">internschiffer</strong>
      <div class="meta-stats">
        <span><strong id="statTotal">0</strong> Einträge</span>
        <span><strong id="statShown">0</strong> sichtbar</span>
        <span><strong id="statShortlist">0</strong> Shortlist</span>
      </div>
    </header>

    <button id="filterScrim" class="filter-scrim" type="button" aria-label="Filter schließen" hidden></button>

    <main class="app-shell">
      <aside class="filters" aria-label="Filter">
        <div class="mobile-filter-head">
          <button id="peekFilters" class="mobile-filter-title" type="button" aria-expanded="false">Open Filter</button>
        </div>

        <label class="search">
          <span class="filter-heading">Suche</span>
          <input id="searchInput" type="search" placeholder="Firma, Ort, Domain, Profil, Tags">
        </label>

        <section class="mobile-category-filter">
          <h2>Kategorie</h2>
          <button id="mobileEthicsFilter" class="drawer-text-filter" type="button">Ethik/Gendergerechtigkeit</button>
        </section>

        <section>
          <h2>Themen</h2>
          <div id="capabilityFilters" class="chip-grid"></div>
        </section>

        <section>
          <h2>Städte</h2>
          <div id="cityFilters" class="chip-grid"></div>
        </section>

        <section>
          <h2>Länder</h2>
          <div id="countryFilters" class="chip-grid"></div>
        </section>
      </aside>
      <div id="filterResizeHandle" class="resize-handle" aria-hidden="true"></div>

      <section class="workspace">
        <div class="cards-toolbar">
          <button id="openFilters" class="sort-option mobile-filter-toggle" type="button" aria-expanded="false">Filter</button>
          <div class="sort-control" aria-label="Sortierung">
            <button id="resetFilters" class="sort-option reset-option" type="button">Reset</button>
            <button class="sort-option active" type="button" data-sort="name">A-Z</button>
            <button id="ethicsFilter" class="sort-option" type="button">Ethik/Gendergerechtigkeit</button>
            <button class="sort-option placeholder" type="button" disabled>Kategorie 2</button>
            <button id="uploadDataButton" class="sort-option upload-option" type="button" hidden>Upload</button>
            <input id="uploadDataInput" type="file" accept=".json,.xlsx,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          </div>
          <span id="uploadDataStatus" class="upload-status" aria-live="polite"></span>
          <button id="shortlistFilter" class="chip shortlist-filter" type="button">
            <span>Nur Shortlist</span><span id="shortlistFilterCount" class="chip-count">0</span>
          </button>
        </div>

        <p id="emptyState" class="empty-detail" hidden>Keine Agentur passt zu den aktuellen Filtern.</p>
        <div id="cardsGrid" class="cards-grid"></div>
      </section>
    </main>

    <script src="data.js?v=mobile-drawer-5"></script>
    <script src="app.js?v=mobile-drawer-5"></script>
  </body>
</html>
